[core] 
backend=headless
renderer=gl
xwayland=true

[shell]
locking=false
panel-position=top

[launcher]
icon=/usr/share/weston/icon_terminal.png
path=/usr/bin/weston-terminal

# Launch btop automatically on the headless Wayland canvas
[autostart]
path=/usr/bin/weston-terminal --command=/usr/bin/btop
